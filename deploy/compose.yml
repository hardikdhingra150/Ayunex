services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ayunex
      POSTGRES_USER: ayunex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayunex_secure_db_pass_2026}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ayunex -d ayunex"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:-ayunex_redis_secure_pass}", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ayunex:${POSTGRES_PASSWORD:-ayunex_secure_db_pass_2026}@database:5432/ayunex}
    command: [alembic, upgrade, head]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ayunex:${POSTGRES_PASSWORD:-ayunex_secure_db_pass_2026}@database:5432/ayunex}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-ayunex_redis_secure_pass}@redis:6379/0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,${API_DOMAIN:-localhost}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      IDENTITY_INTROSPECTION_URL: ${IDENTITY_INTROSPECTION_URL:-}
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-}
      GUIDANCE_MODE: ${GUIDANCE_MODE:-corpus}
      GUIDANCE_SERVICE_URL: ${GUIDANCE_SERVICE_URL:-}
      GUIDANCE_SERVICE_TOKEN: ${GUIDANCE_SERVICE_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_GENERATION_MODEL: ${AI_GENERATION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      CLOUD_PROCESSING_ALLOWED: ${CLOUD_PROCESSING_ALLOWED:-false}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      CORPUS_REPORT_PATH: /srv/data/corpus/raw/ingestion-report.json
    volumes:
      - corpus:/srv/data/corpus/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  corpus:
  caddy_data:
  caddy_config:
