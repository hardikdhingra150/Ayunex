services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ayunex
      POSTGRES_USER: ayunex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ayunex -d ayunex"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: [alembic, upgrade, head]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS including 127.0.0.1 for health probes}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set explicit HTTPS CORS_ORIGINS}
      AUTH_MODE: builtin
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the HTTPS application origin}
      SMTP_HOST: ${SMTP_HOST:?Set authenticated SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP user}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP password}
      MAIL_FROM: ${MAIL_FROM:?Set verified sender address}
      GUIDANCE_MODE: ${GUIDANCE_MODE:-corpus}
      GUIDANCE_SERVICE_URL: ${GUIDANCE_SERVICE_URL:-}
      GUIDANCE_SERVICE_TOKEN: ${GUIDANCE_SERVICE_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_GENERATION_MODEL: ${AI_GENERATION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      CLOUD_PROCESSING_ALLOWED: ${CLOUD_PROCESSING_ALLOWED:-false}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      CORPUS_REPORT_PATH: /srv/data/corpus/raw/ingestion-report.json
    volumes:
      - corpus:/srv/data/corpus/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  corpus:
  caddy_data:
  caddy_config:
